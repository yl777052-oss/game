<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現代感貪吃蛇遊戲</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>SNAKE GAME</h1>
        <div class="score-board">
            <div class="score-box">分數: <span id="current-score">0</span></div>
            <div class="score-box">最高紀錄: <span id="high-score">0</span></div>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls-hint">使用方向鍵 (↑ ↓ ← →) 或 WASD 控制</div>
        <button id="start-btn">開始 / 重新遊戲</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
